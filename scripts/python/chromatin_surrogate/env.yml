# Conda environment for the chromatin-surrogate pipeline (Supplementary Fig. S15B).
# Create once on the node:   conda env create -f env.yml   then:   conda activate chromsurr
# HOMER's hg38 genome is NOT installed by conda — see README step 0.
name: chromsurr
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - bedtools>=2.31
  - deeptools>=3.5
  - homer>=4.11           # findMotifsGenome.pl
  - ucsc-liftover         # UCSC liftOver binary (BED)
  - crossmap>=0.6         # liftOver for bigWig + BED (CrossMap)
  - ucsc-bigwiginfo       # inspect bigWig chrom builds
  - ucsc-bedclip
  - samtools
  - pandas
  - numpy
  - matplotlib
  - meme                  # optional: AME as an orthogonal motif-enrichment check
